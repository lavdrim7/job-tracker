spring:
  application:
    name: job-tracker
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:jobtracker}
    username: ${DB_USER:jobtracker}
    # Ingen standardverdi: passordet skal alltid komme fra miljøet.
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      # Flyway eier skjemaet. Hibernate skal bare kontrollere at det stemmer.
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  jwt:
    # Ingen standardverdi: appen nekter å starte uten JWT_SECRET (minst 32 tegn).
    secret: ${JWT_SECRET}
    # ISO-8601-varighet, f.eks. PT1H eller PT30M.
    expiration: ${JWT_EXPIRATION:PT1H}

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health
